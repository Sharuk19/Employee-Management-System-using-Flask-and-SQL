apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-app
  template:
    metadata:
      labels:
        app: employee-app
    spec:
      containers:
        - name: employee-app
          image: sharuk19/employee-management-system:v1.0.2
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "sqlite:////app/employees.db"