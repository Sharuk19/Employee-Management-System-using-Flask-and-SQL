{% extends "base.html" %}
{% block title %}Edit Employee{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">

                <h3 class="card-title mb-4 text-center">
                    Edit Employee
                </h3>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ employee.name }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ employee.email }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text"
                               name="department"
                               class="form-control"
                               value="{{ employee.department }}"
                               required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Role</label>
                        <input type="text"
                               name="role"
                               class="form-control"
                               value="{{ employee.role }}"
                               required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-warning">
                            Update Employee
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
